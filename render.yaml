services:
  - type: web
    name: libre-api
    runtime: node
    buildCommand: npm install --include=dev --legacy-peer-deps && npm run build
    startCommand: node dist/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: libre-db
          property: connectionString
      - key: FRONTEND_ORIGIN
        value: https://rigocrypto.github.io
      - key: STORAGE_ENGINE
        value: drizzle
      - key: SESSION_SECRET
        generateValue: true
      - key: ESCROW_VERIFIER_MODE
        value: mock
      - key: FIREBASE_ADMIN_PROJECT_ID
        sync: false
      - key: FIREBASE_ADMIN_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_ADMIN_PRIVATE_KEY
        sync: false

databases:
  - name: libre-db
    plan: free
    databaseName: libre
    user: libre
