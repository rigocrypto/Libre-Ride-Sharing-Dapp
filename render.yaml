services:
  - type: web
    name: libre-api
    runtime: node
    buildCommand: npm install --include=dev --legacy-peer-deps && npm run build
    startCommand: node dist/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      # Lead capture uses an external managed Postgres (Neon free tier) instead
      # of Render's free Postgres, which expires after 30 days. Set this in the
      # Render dashboard to the Neon POOLED connection string, e.g.
      #   postgresql://USER:PASSWORD@ep-xxxx-pooler.<region>.aws.neon.tech/libre?sslmode=require
      # Keep sslmode=require so the pg client negotiates TLS.
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_ORIGIN
        value: https://rigocrypto.github.io
      - key: STORAGE_ENGINE
        value: drizzle
      - key: SESSION_SECRET
        generateValue: true
      - key: ESCROW_VERIFIER_MODE
        value: mock
      - key: FIREBASE_ADMIN_PROJECT_ID
        sync: false
      - key: FIREBASE_ADMIN_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_ADMIN_PRIVATE_KEY
        sync: false

# No Render-managed database: DATABASE_URL above points to external Neon Postgres
# (set it in the Render dashboard). Migrations run automatically on startup via
# runProductionMigrations(); the DB retry helper tolerates Neon scale-to-zero
# cold starts.
