[profile.default]
src = "contracts"
out = "artifacts/contracts"
libs = ["lib", "node_modules"]
test = "contracts/test"
script = "contracts/script"
solc = "0.8.20"

[rpc_endpoints]
base_sepolia = "${RPC_URL_BASE_SEPOLIA}"

[etherscan]
base_sepolia = { key = "${BASESCAN_API_KEY}", url = "https://api-sepolia.basescan.org/api" }
