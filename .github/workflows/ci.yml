name: Libre CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: 20.x
  PNPM_VERSION: 9.x
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  REDIS_URL: ${{ secrets.REDIS_URL }}
  RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
  TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
  TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
  TWILIO_PHONE_NUMBER: ${{ secrets.TWILIO_PHONE_NUMBER }}
  ONESIGNAL_APP_ID: ${{ secrets.ONESIGNAL_APP_ID }}
  ONESIGNAL_API_KEY: ${{ secrets.ONESIGNAL_API_KEY }}
  UPLOADTHING_API_KEY: ${{ secrets.UPLOADTHING_API_KEY }}
  ALCHEMY_BASE_RPC: ${{ secrets.ALCHEMY_BASE_RPC }}
  USDC_CONTRACT_ADDRESS_TESTNET: ${{ secrets.USDC_CONTRACT_ADDRESS_TESTNET }}
  PRIVATE_KEY_DEPLOYER: ${{ secrets.PRIVATE_KEY_DEPLOYER }}
  STORAGE_ENGINE: drizzle
  RETENTION_DAYS: 730
  PROTOCOL_FEE_BPS: 300

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        ports: ["5432:5432"]
        env:
          POSTGRES_USER: libre
          POSTGRES_PASSWORD: libre
          POSTGRES_DB: libre
        options: >-
          --health-cmd="pg_isready -U libre -d libre"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgresql://libre:libre@localhost:5432/libre
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run database migration
        run: psql "$DATABASE_URL" -f migrations/001_init.sql

      - name: Seed database
        run: pnpm tsx server/scripts/seed.ts

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck || pnpm tsconfig-references --build

      - name: Unit tests
        run: pnpm test

      - name: Build client
        run: pnpm --filter client build

      - name: Build server
        run: pnpm --filter server build

      - name: Package artifacts
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          tar -czf libre-build-artifacts.tgz dist/ client/dist/
      - name: Upload artifacts
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: libre-build
          path: libre-build-artifacts.tgz





