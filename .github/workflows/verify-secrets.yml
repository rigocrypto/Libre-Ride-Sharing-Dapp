name: Verify required secrets

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  check-frontend-secrets:
    name: Frontend secrets (GitHub Pages build)
    runs-on: ubuntu-latest

    steps:
      - name: Check required frontend secrets
        run: |
          set -euo pipefail
          missing=false
          vars=(
            VITE_FIREBASE_API_KEY
            VITE_FIREBASE_AUTH_DOMAIN
            VITE_FIREBASE_PROJECT_ID
            VITE_FIREBASE_STORAGE_BUCKET
            VITE_FIREBASE_MESSAGING_SENDER_ID
            VITE_FIREBASE_APP_ID
            VITE_API_BASE_URL
          )

          for v in "${vars[@]}"; do
            val="${!v:-}"
            if [ -z "$val" ]; then
              echo "Missing $v"
              missing=true
            else
              echo "Found $v"
            fi
          done

          if [ "$missing" = true ]; then
            echo "One or more required frontend secrets are missing."
            echo "Add them under Settings -> Secrets and variables -> Actions."
            exit 1
          fi
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}

  check-backend-secrets:
    name: Backend secrets (Render deploy)
    runs-on: ubuntu-latest
    # Advisory only — backend secrets live in Render, not GitHub Pages.
    # Set continue-on-error: false once Render env vars are fully configured.
    continue-on-error: true

    steps:
      - name: Check required backend secrets
        run: |
          set -euo pipefail
          missing=false
          vars=(
            FIREBASE_ADMIN_PRIVATE_KEY
          )

          for v in "${vars[@]}"; do
            val="${!v:-}"
            if [ -z "$val" ]; then
              echo "Missing $v (backend/Render secret)"
              missing=true
            else
              echo "Found $v"
            fi
          done

          if [ "$missing" = true ]; then
            echo "One or more backend secrets are missing."
            echo "These are required for Render deployment, not GitHub Pages."
            echo "Add them to Render env vars or to GitHub Actions secrets for backend CI."
            exit 1
          fi
        env:
          FIREBASE_ADMIN_PRIVATE_KEY: ${{ secrets.FIREBASE_ADMIN_PRIVATE_KEY }}
